# Texto
font_family JetBrainsMono Nerd Font
font_size 13.0

# Ventana
window_padding_width 10
background_opacity 1.0

# Colores: oscuro con acento naranja
# foreground #dedede
# background #17191d
# cursor #ff9a3c
# selection_foreground #17191d
# selection_background #ff9a3c

# Pestañas
tab_bar_style powerline
# active_tab_foreground #17191d
# active_tab_background #ff9a3c
# inactive_tab_foreground #c5c5c5
# inactive_tab_background #30343b

# Historial
scrollback_lines 5000


# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# Dracula con fondo OLED y acentos verde/amarillo/azul
background #000000
foreground #39ff14
cursor #a6e3a1
cursor_text_color #000000
background_opacity 1.0
# END_KITTY_THEME
